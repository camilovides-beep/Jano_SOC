<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101418">
  <title>Jano SOC: Physical-Cyber Watch</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <div id="photo-bg" class="photo-bg" aria-hidden="true"></div>
  <canvas id="stage" aria-label="Avatar"></canvas>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <header class="hud">
    <div id="status" class="status" data-state="idle"><span class="dot"></span><span id="status-text">En espera</span></div>
    <div id="owner" class="owner" hidden>Modo Camilo</div>
    <div id="alert" class="alert-badge" role="status" hidden><span class="alert-dot"></span><span id="alert-text"></span></div>
    <div id="mic" class="mic" hidden><span class="mic-dot"></span>Micrófono activo</div>
  </header>

  <aside id="card" class="card-panel" hidden aria-live="polite">
    <h2 id="card-title"></h2>
    <ul id="card-lines"></ul>
    <img id="card-qr" alt="Código QR de contacto" hidden>
    <p id="card-caption"></p>
  </aside>

  <aside id="gallery" class="gallery" hidden aria-live="polite">
    <h2 id="gallery-title"></h2>
    <div id="gallery-items" class="gallery-items"></div>
    <p id="gallery-credit" class="gallery-credit"></p>
  </aside>

  <aside id="music" class="music" hidden>
    <div id="music-player"></div>
    <div class="music-bar"><span class="music-title"></span><span class="music-vol"></span></div>
  </aside>

  <section id="subtitles" class="subtitles" aria-live="polite">
    <p id="sub-user" class="sub-user"></p>
    <p id="sub-avatar" class="sub-avatar"></p>
  </section>

  <div id="away" class="away" hidden><span id="away-text"></span><span id="away-notice" class="away-notice"></span></div>

  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card">
      <h1>Jano SOC</h1>
      <p class="gate-sub">Physical-Cyber Watch</p>
      <p id="gate-text">Toca para empezar a conversar. El navegador te pedirá permiso para usar el micrófono.</p>
      <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="Código de acceso" hidden>
      <button id="btn-start" type="submit">Hablar con Jano</button>
      <p id="gate-error" class="gate-error" role="alert"></p>
    </form>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
