services:
  jano:
    build: .
    image: jano-soc
    container_name: jano-soc
    restart: unless-stopped
    env_file: .env
    environment:
      LOGS_DIR: /app/logs
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      # Llamadas de WhatsApp (WebRTC): descomentar y definir CALL_PUBLIC_IP en .env.
      # - "40000-40009:40000-40009/udp"
      # Syslog de routers, cortafuegos y servidores: descomentar y definir LOGS_SYSLOG_PORT=5514 en .env.
      # - "5514:5514/udp"
      # - "5514:5514/tcp"
    volumes:
      # Base SQLite, fotos y respaldos. El contenedor corre como node (UID 1000).
      - ./data:/app/data
      # Logs de aplicaciones y de red para analizar en modo dueño (solo lectura). Otra carpeta: LOGS_HOST_DIR en .env.
      - ${LOGS_HOST_DIR:-./logs}:/app/logs:ro
